[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stiff-physics"
version = "0.1.0"
description = "Python interface for the StiffGIPC IPC physics engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "polyscope",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
include = ["stiff_physics*"]
