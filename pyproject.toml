[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "stiff-physics"
version = "0.6.1"
description = "Python interface for the StiffGIPC IPC physics engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
# polyscope 2.6.x removed psim.SetWindowFontScale (followed imgui upstream
# deprecation). Until demos migrate to PushFont/PopFont, pin to <2.6.
# Lower bound 2.4 = first version with the imgui binding subset we use.
vis = ["polyscope>=2.4,<2.6"]
usd = ["usd-core"]
dev = ["pytest", "black", "ruff"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-DBUILD_GL_VIEWER=OFF"]
wheel.packages = ["stiff_physics"]
